<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>하늘의 전사 3D</title>
<meta name="theme-color" content="#00fff2">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<link rel="stylesheet" href="/css/style.css">
</head><body>
<div id="game-container">
  <canvas id="gameCanvas" width="589" height="1010" style="width: 589px; height: 1010px;"></canvas>

  <div id="hitFlash"></div>

  <div id="hud">
    <div class="hud-item">점수 <span id="score">0</span></div>
    <div class="hud-item" id="hearts"></div>
    <div class="hud-item">레벨 <span id="level">1</span></div>
  </div>

  <div id="comboBadge" class="hidden"></div>

  <div id="powerupHud"></div>

  <div id="bossBar" class="hidden">
    <div id="bossName">👑 적군의 왕</div>
    <div id="bossBarTrack"><div id="bossBarFill"></div></div>
  </div>

  <div id="banner" class="hidden"></div>

  <div id="muteBtn">🔊</div>
  <div id="pauseBtn">⏸</div>

  <div id="pauseScreen" class="hidden">
    <h1>일 시 정 지</h1>
    <button id="resumeBtn">계 속 하 기</button>
  </div>

  <div id="startScreen">
    <div class="title">하늘의 전사 3D</div>
    <div class="instructions">
      <p>← → / A D : 좌우 이동</p>
      <p>↑ ↓ / W S : 위아래 이동</p>
      <p>스페이스바 : 발사 · ESC : 일시정지</p>
      <p>🎯관통 · 🔱샷건 · 🚀유도 · ⚡연사 · 🛡실드 아이템을 챙기세요</p>
    </div>
    <div class="difficulty-row">
      <button class="diff-btn" data-difficulty="easy">쉬움</button>
      <button class="diff-btn" data-difficulty="normal">보통</button>
      <button class="diff-btn" data-difficulty="hard">어려움</button>
    </div>
    <button id="startBtn">시 작 하 기</button>
    <button id="viewRankBtn">🏆 랭킹 보기</button>
  </div>

  <div id="gameOverScreen" class="hidden">
    <h1>게임 오버</h1>
    <p>최종 점수: <span id="finalScore">0</span></p>
    <p>도달 레벨: <span id="finalLevel">1</span></p>
    <button id="restartBtn">다시 시작</button>

    <div id="scoreSubmit">
      <input id="nicknameInput" maxlength="12" placeholder="닉네임 (최대 12자)">
      <button id="submitScoreBtn">랭킹 등록</button>
    </div>
    <p id="submitStatus"></p>

    <div id="gameOverLeaderboard">
      <h3>🏆 TOP 10</h3>
      <ol id="gameOverLeaderboardList" class="lb-list"></ol>
    </div>
  </div>

  <div id="leaderboardModal" class="hidden modal-overlay">
    <div class="modal-box">
      <h2>🏆 TOP 10</h2>
      <ol id="leaderboardList" class="lb-list"></ol>
      <button id="closeLeaderboardBtn">닫기</button>
    </div>
  </div>

  <div id="touchControls">
    <div id="joystickBase"><div id="joystickKnob"></div></div>
    <div id="fireBtn" class="ctrl-btn">🔫</div>
  </div>
</div>

<script src="/vendor/three.min.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
